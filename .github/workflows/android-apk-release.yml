name: Build & Auto-Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build S&S Racing APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Generate Capacitor Android Project
        run: |
          npm install --no-save @capacitor/cli@8 @capacitor/android@8
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug & Release APKs
        run: |
          mkdir -p release-apks
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apks/SS-Racing-debug.apk

          ./gradlew assembleRelease

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="../release-apks/SS-Racing-aligned.apk"
          SIGNED_APK="../release-apks/SS-Racing-release.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASS }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASS }}" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
          else
            keytool -genkey -v \
              -keystore sns-ci.keystore \
              -alias snsracing \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass snsracing123 \
              -keypass snsracing123 \
              -dname "CN=S&S Studios, OU=Sayod and Subhon, O=S&S Studios, L=City, S=State, C=US"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks sns-ci.keystore \
              --ks-key-alias snsracing \
              --ks-pass pass:snsracing123 \
              --key-pass pass:snsracing123 \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
          fi

          rm -f "$ALIGNED_APK" ../release-apks/*.idsig

      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SS-Racing-APKs
          path: release-apks/*.apk

      - name: Publish GitHub Release with Downloadable APKs
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: S&S Racing ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            ## S&S Racing — Android APK Release
            **Created by SAYOD AND SUBHON (S&S STUDIOS)**

            ### Download & Install on Android
            1. Download **`SS-Racing-release.apk`** (or **`SS-Racing-debug.apk`** for testing) below.
            2. Open the `.apk` file on your Android phone.
            3. Tap **Install** (enable *Allow from this source* if prompted) and play!
          files: |
            release-apks/SS-Racing-release.apk
            release-apks/SS-Racing-debug.apk
          draft: false
          prerelease: false
